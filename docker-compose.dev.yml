services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: laravel-dev-app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www 
      - ./docker/php/local.dev.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
      - redis
    networks:
      - dev-network

  webserver:
    image: nginx:alpine
    container_name: laravel-dev-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dev-network

  db:
    image: mysql:8.0
    container_name: laravel-dev-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_db}
      MYSQL_USER: ${DB_USERNAME:-db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db_password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-db_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dev-network

  redis:
    image: redis:alpine
    container_name: laravel-dev-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - dev-network

volumes:
  db_data:
  redis_data:

networks:
  dev-network:
    driver: bridge