version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel-dev-app
    restart: unless-stopped
    # Maps your local OS user to the container to prevent permission issues
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www  # Instant code syncing
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - db
    networks:
      - dev-network

  webserver:
    image: nginx:alpine
    container_name: laravel-dev-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dev-network

  db:
    image: mysql:8.0
    container_name: laravel-dev-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_db}
      MYSQL_USER: ${DB_USERNAME:-db_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db_password}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-db_password}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dev-network

volumes:
  db_data:

networks:
  dev-network:
    driver: bridge